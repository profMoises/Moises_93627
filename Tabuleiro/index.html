<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabuleiro de Xadrez</title>
  <style>
    /* Centraliza o tabuleiro na tela */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* ALTURA  MÁX PERMITIDA DO NAVEGADOR*/
      margin: 0;
      background-color: #ccc;
    }

    /* Área do tabuleiro */
    .tabuleiro {
      width: 480px;    /* 8 colunas de 60px */
      height: 480px;   /* 8 linhas de 60px */
      border: 4px solid #333;
      display: flex;
      flex-wrap: wrap; /* Quebra linha a cada 8 quadrados */
    }

    /* Cada quadrado */
    .quadrado {
      width: 60px;
      height: 60px;
    }

    .branco {
      background-color: white;
    }

    .preto {
      background-color: black;
    }
  </style>
</head>
<body>
  <div class="tabuleiro">
    <!-- Linha 1 -->
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>

    <!-- Linha 2 -->
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>

    <!-- Linha 3 -->
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>

    <!-- Linha 4 -->
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>

    <!-- Linha 5 -->
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>

    <!-- Linha 6 -->
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>

    <!-- Linha 7 -->
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>

    <!-- Linha 8 -->
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
    <div class="quadrado preto"></div>
    <div class="quadrado branco"></div>
  </div>
</body>
</html>
